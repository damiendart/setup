---
- name: 'Reconfigure "unattended-upgrades"'
  ansible.builtin.command:
    cmd: 'dpkg-reconfigure -f noninteractive unattended-upgrades'
  changed_when: true

- name: 'Restart OpenSSH Server'
  ansible.builtin.service:
    name: 'ssh'
    state: 'restarted'

- name: 'Restart UFW'
  ansible.builtin.service:
    name: 'ufw'
    state: 'restarted'
